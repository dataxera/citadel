name: mindweaver-0.1.0
title: Mindweaver 0.1.0
version: 0.1.0-alpha.1
configuration:
  components:
    pgsql:
      package_type: helm
      charts:
        main:
          repo: https://cloudnative-pg.github.io/charts
          chart: cluster
          version: "0.5.0"
      images:
        main:
          repository: ghcr.io/cloudnative-pg/postgresql
          tag: "18.4"
        pgbouncer:
          repository: ghcr.io/cloudnative-pg/pgbouncer
          tag: "1.25.1"
    nifi:
      package_type: helm
      charts:
        main:
          repo: ghcr.io/konpyutaika/helm-charts
          chart: nifi-cluster
          version: "1.17.0"
      images:
        main:
          repository: apache/nifi
          tag: "2.9.0"
    airflow:
      package_type: helm
      charts:
        main:
          repo: https://airflow.apache.org
          chart: airflow
          version: "1.22.0"
      images:
        main:
          repository: ghcr.io/kagesenshi/mindweaver/airflow
          tag: "3.2.2-rev.5"
        redis:
          repository: redis
          tag: "7.2-bookworm"
        statsd_exporter:
          repository: quay.io/prometheus/statsd-exporter
          tag: "v0.30.0"
        git_sync:
          repository: registry.k8s.io/git-sync/git-sync
          tag: "v4.4.2"
    kafka:
      package_type: helm
      charts:
        main:
          repo: ghcr.io/kagesenshi/mindweaver/charts
          chart: kafka
          version: "0.1.3"
      images:
        main:
          repository: ghcr.io/kagesenshi/mindweaver/kafka
          tag: "4.0.0-rev.1"
    superset:
      package_type: helm
      charts:
        main:
          repo: https://apache.github.io/superset
          chart: superset
          version: "0.15.0"
      images:
        main:
          repository: ghcr.io/kagesenshi/mindweaver/superset
          tag: "6.1.0-rev.1"
        redis:
          repository: bitnamilegacy/redis
          tag: "7.0.10-debian-11-r4"
        init:
          repository: apache/superset
          tag: "dockerize"
    hive_metastore:
      package_type: helm
      charts:
        main:
          repo: ghcr.io/kagesenshi/mindweaver/charts
          chart: hive-metastore
          version: "0.1.11"
      images:
        main:
          repository: ghcr.io/kagesenshi/mindweaver/hive-metastore
          tag: "4.2.0-rev.6"
    trino:
      package_type: helm
      charts:
        main:
          repo: https://trinodb.github.io/charts
          chart: trino
          version: "1.41.0"
      images:
        main:
          repository: trinodb/trino
          tag: "482"
        prepare_tls:
          repository: eclipse-temurin
          tag: "17-jre-alpine"
    doris:
      package_type: helm
      charts:
        main:
          repo: https://charts.selectdb.com
          chart: doris
          version: "25.8.0"
      images:
        fe:
          repository: selectdb/doris.fe-ubuntu
          tag: "2.1.8"
        be:
          repository: selectdb/doris.be-ubuntu
          tag: "2.1.8"

    # Core Kubernetes integrations
    argocd:
      package_type: helm
      charts:
        main:
          repo: https://argoproj.github.io/argo-helm
          chart: argo/argo-cd
          version: "9.4.4"
      images:
        main:
          repository: quay.io/argoproj/argocd
          tag: "v2.14.2"
        dex:
          repository: ghcr.io/dexidp/dex
          tag: "v2.41.1"
        redis:
          repository: public.ecr.aws/docker/library/redis
          tag: "7.4.2-alpine"
    cert-manager:
      package_type: helm
      charts:
        main:
          repo: https://charts.jetstack.io
          chart: cert-manager
          version: "v1.20.0"
      images:
        main:
          repository: quay.io/jetstack/cert-manager-controller
          tag: "v1.20.0"
        cainjector:
          repository: quay.io/jetstack/cert-manager-cainjector
          tag: "v1.20.0"
        webhook:
          repository: quay.io/jetstack/cert-manager-webhook
          tag: "v1.20.0"
    cnpg:
      package_type: helm
      charts:
        main:
          repo: https://cloudnative-pg.github.io/charts
          chart: cloudnative-pg
          version: "0.27.1"
      images:
        main:
          repository: ghcr.io/cloudnative-pg/cloudnative-pg
          tag: "1.28.1"
    envoy-gateway:
      package_type: helm
      charts:
        main:
          repo: docker.io/envoyproxy
          chart: gateway-helm
          version: "1.8.1"
      images:
        main:
          repository: docker.io/envoyproxy/gateway
          tag: "v1.8.1"
        envoy:
          repository: docker.io/envoyproxy/envoy
          tag: "distroless-v1.38.1"
    kafka-operator:
      package_type: helm
      charts:
        main:
          repo: https://strimzi.io/charts/
          chart: strimzi-kafka-operator
          version: "0.50.1"
      images:
        main:
          repository: quay.io/strimzi/operator
          tag: "0.50.1"
    nifikop-operator:
      package_type: helm
      charts:
        main:
          repo: ghcr.io/konpyutaika/helm-charts
          chart: nifikop
          version: "1.17.0"
      images:
        main:
          repository: ghcr.io/konpyutaika/docker-images/nifikop
          tag: "v1.17.0-release"
    doris-operator:
      package_type: helm
      charts:
        main:
          repo: https://charts.selectdb.com
          chart: doris-operator
          version: "25.8.0"
      images:
        main:
          repository: apache/doris
          tag: "operator-26.0.1"
