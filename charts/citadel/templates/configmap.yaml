apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "citadel.fullname" . }}-config
  labels:
    {{- include "citadel.labels" . | nindent 4 }}
data:
  CITADEL_TIMEZONE: {{ .Values.config.timezone | quote }}
  CITADEL_ENABLE_AUTH: {{ .Values.config.enableAuth | quote }}
  CITADEL_EMBEDDED_WORKER: "false"
