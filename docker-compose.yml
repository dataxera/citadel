name: citadel
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: citadel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: backend-base
    image: ghcr.io/dataxera/citadel-dev:latest
    command: sh -c "uv run dxc db migrate && uv run dxc stack import"
    env_file:
      - ./backend/.env
    environment:
      CITADEL_DB_HOST: db
      CITADEL_DB_USER: postgres
      CITADEL_DB_PASS: password
      CITADEL_DB_NAME: citadel
      CITADEL_DEFAULT_ADMIN_USERNAME: "admin"
      CITADEL_DEFAULT_ADMIN_PASSWORD: "password"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migration:/app/migration
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: ghcr.io/dataxera/citadel-dev:latest
    command: uv run dxc run --port 8000 --bind 0.0.0.0 --log-file /var/log/citadel.log
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      CITADEL_DB_HOST: db
      CITADEL_DB_USER: postgres
      CITADEL_DB_PASS: password
      CITADEL_DB_NAME: citadel
      CITADEL_CELERY_BROKER_URL: redis://redis:6379/0
      CITADEL_CELERY_RESULT_BACKEND: redis://redis:6379/0
      CITADEL_EMBEDDED_WORKER: "false"
      CITADEL_BRAND_NAME: "Citadel"
      CITADEL_BRAND_LOGO: "citadel.svg"
      CITADEL_BRAND_BGCOLOR: "#fff"
      CITADEL_DEFAULT_ADMIN_USERNAME: "admin"
      CITADEL_DEFAULT_ADMIN_PASSWORD: "password"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migration:/app/migration
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    profiles: ["app"]
    image: ghcr.io/dataxera/citadel-dev:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started
    command: uv run dxc scheduler --reload
    env_file:
      - ./backend/.env
    environment:
      CITADEL_DB_HOST: db
      CITADEL_DB_USER: postgres
      CITADEL_DB_PASS: password
      CITADEL_DB_NAME: citadel
      CITADEL_CELERY_BROKER_URL: redis://redis:6379/0
      CITADEL_CELERY_RESULT_BACKEND: redis://redis:6379/0
      CITADEL_EMBEDDED_WORKER: "false"
      CITADEL_DEFAULT_ADMIN_USERNAME: "admin"
      CITADEL_DEFAULT_ADMIN_PASSWORD: "password"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migration:/app/migration
      - ./backend/alembic.ini:/app/alembic.ini

  worker:
    profiles: ["app"]
    image: ghcr.io/dataxera/citadel-dev:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started
    command: uv run dxc worker --reload
    env_file:
      - ./backend/.env
    environment:
      CITADEL_DB_HOST: db
      CITADEL_DB_USER: postgres
      CITADEL_DB_PASS: password
      CITADEL_DB_NAME: citadel
      CITADEL_CELERY_BROKER_URL: redis://redis:6379/0
      CITADEL_CELERY_RESULT_BACKEND: redis://redis:6379/0
      CITADEL_EMBEDDED_WORKER: "false"
      CITADEL_DEFAULT_ADMIN_USERNAME: "admin"
      CITADEL_DEFAULT_ADMIN_PASSWORD: "password"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migration:/app/migration
      - ./backend/alembic.ini:/app/alembic.ini

  frontend:
    profiles: ["app"]
    build:
      context: .
      target: frontend-builder
    image: ghcr.io/dataxera/citadel-frontend-dev:latest
    command: npm run dev -- --port 3000 --host 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      web:
        condition: service_started

  proxy:
    profiles: ["app"]
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./container/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"
